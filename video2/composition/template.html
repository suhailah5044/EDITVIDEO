<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Video 2 Overlay</title>
<style>
@font-face{font-family:M;font-weight:700;src:url(m0.ttf)}
@font-face{font-family:M;font-weight:800;src:url(m1.ttf)}
@font-face{font-family:M;font-weight:900;src:url(m2.ttf)}
:root{--y:#FFD21F;--w:#FFFFFF;--ink:#141414}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;font-family:M,sans-serif}
.card{position:absolute;left:0;right:0;top:230px;text-align:center;opacity:0}
.l1{font-weight:800;font-size:46px;color:var(--w);letter-spacing:.5px;
  text-shadow:0 3px 14px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.6)}
.l2{display:inline-block;position:relative;margin-top:10px;font-weight:900;font-size:66px;color:var(--y);
  letter-spacing:1px;text-shadow:0 4px 18px rgba(0,0,0,.55),0 2px 3px rgba(0,0,0,.5)}
.l2 .hl{position:absolute;left:-14px;right:-14px;bottom:4px;height:22px;background:var(--y);opacity:.28;
  border-radius:6px;transform-origin:left center;transform:scaleX(0);z-index:-1}
.word{display:inline-block}
/* subjects */
#subj{top:210px}
.badge{display:inline-flex;align-items:center;gap:12px;background:var(--y);color:var(--ink);font-weight:900;
  font-size:44px;padding:10px 26px;border-radius:40px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 14px;width:900px;margin:22px auto 0}
.chip{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.96);color:var(--ink);
  font-weight:800;font-size:32px;padding:9px 20px 9px 12px;border-radius:30px;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0}
.tick{width:34px;height:34px;border-radius:50%;background:var(--y);display:grid;place-items:center}
.tick svg{width:20px;height:20px}
/* cta */
.basket{display:inline-grid;place-items:center;width:76px;height:76px;border-radius:22px;background:var(--y);
  vertical-align:middle;margin-left:16px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.basket svg{width:46px;height:46px}
.yr{color:var(--w)}
#topshade{position:absolute;left:0;right:0;top:0;height:620px;
  background:linear-gradient(180deg,rgba(10,10,12,.55) 0%,rgba(10,10,12,.35) 55%,rgba(10,10,12,0) 100%)}
#abc{position:absolute;left:0;right:0;top:120px;height:440px;overflow:visible}
.sym{position:absolute;font-family:M,sans-serif;font-weight:900;color:#fff;opacity:0;
  text-shadow:0 2px 10px rgba(0,0,0,.35)}
.sym.y{color:var(--y)}
/* soft light leak used on transitions */
#flash{position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 10%,rgba(255,236,170,.55),rgba(255,236,170,0) 60%);opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="topshade"></div>
  <div id="abc"></div>
  <div id="flash"></div>
  <div id="cards"></div>
</div>
<script src="gsap.min.js"></script>
<script>
const CFG = /*CONFIG*/;
const DURATION = CFG.duration;
const tl = gsap.timeline({paused:true});
const TICK='<span class="tick"><svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" stroke="#141414" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
const BASKET='<span class="basket"><svg viewBox="0 0 24 24"><path d="M3 9h18l-1.6 10.2A2 2 0 0117.4 21H6.6a2 2 0 01-2-1.8L3 9z" fill="#141414"/><path d="M8 9l3-5M16 9l-3-5" stroke="#141414" stroke-width="2.2" stroke-linecap="round"/></svg></span>';

// ABC background
const SYMS=[['A',70,40,64,0],['ب',230,330,60,1],['1',520,20,56,0],['+',760,70,52,1],['C',960,30,60,0],
            ['?',40,300,50,1],['2',985,330,56,1],['B',40,170,46,0],['×',160,260,44,0],['ت',640,350,50,1],
            ['3',380,370,44,0],['−',1010,160,44,0],['a',330,10,42,1]];
const abc=document.getElementById('abc');
SYMS.forEach(([ch,x,y,sz,yl],i)=>{
  const d=document.createElement('div'); d.className='sym'+(yl?' y':''); d.textContent=ch;
  d.style.left=x+'px'; d.style.top=y+'px'; d.style.fontSize=sz+'px'; abc.appendChild(d);
  tl.fromTo(d,{opacity:0,scale:.4,rotation:(i%2?-18:18)},{opacity:yl?.30:.20,scale:1,rotation:(i%2?-8:8),duration:.5,ease:'back.out(2)'},0.04*i);
  const dur=2.2+(i%5)*0.35;
  tl.to(d,{y:(i%2?-16:16),x:(i%3-1)*10,rotation:(i%2?6:-6),duration:dur,yoyo:true,repeat:Math.ceil(DURATION/dur)+1,ease:'sine.inOut'},0.6+0.04*i);
});

const host=document.getElementById('cards');
CFG.cards.forEach((c,i)=>{
  const el=document.createElement('div'); el.className='card'; el.id='k'+i;
  if(c.type==='list'){
    el.style.top='210px';
    el.innerHTML='<div class="badge">'+c.badge+'</div><div class="chips">'+c.chips.map(t=>'<span class="chip">'+TICK+t+'</span>').join('')+'</div>';
  } else {
    const pop = c.pop ? ' <span class="word yr">'+c.pop.text+'</span>' : '';
    el.innerHTML='<div class="l1">'+c.l1+'</div><div class="l2"><span class="hl"></span>'+c.l2+pop+(c.type==='cta'?BASKET:'')+'</div>';
  }
  host.appendChild(el);
  const k='#k'+i;
  if(c.type==='list'){
    tl.fromTo(k,{opacity:0},{opacity:1,duration:.01},c.tin);
    tl.fromTo(k+' .badge',{scale:.4,opacity:0},{scale:1,opacity:1,duration:.35,ease:'back.out(2.2)'},c.tin);
    c.chipT.forEach((t,j)=>tl.fromTo(k+` .chip:nth-child(${j+1})`,{opacity:0,scale:.5,y:14},{opacity:1,scale:1,y:0,duration:.3,ease:'back.out(2.4)'},t));
    tl.to(k,{opacity:0,y:-14,duration:.22,ease:'power2.in'},c.tout);
  } else {
    tl.fromTo(k,{opacity:0,y:-26,scale:.96},{opacity:1,y:0,scale:1,duration:.32,ease:'back.out(1.8)'},c.tin);
    tl.fromTo(k+' .l2',{y:18,opacity:0},{y:0,opacity:1,duration:.3,ease:'power3.out'},c.tin+.08);
    tl.to(k+' .hl',{scaleX:1,duration:.35,ease:'power2.out'},c.thl);
    tl.fromTo(k+' .l2',{scale:1},{scale:1.06,duration:.14,yoyo:true,repeat:1,ease:'power1.inOut'},c.thl);
    if(c.pop) tl.fromTo(k+' .yr',{scale:.3,opacity:0},{scale:1,opacity:1,duration:.32,ease:'back.out(2.6)'},c.pop.t);
    if(c.type==='cta'){
      tl.fromTo(k+' .basket',{rotation:-14,scale:.6},{rotation:0,scale:1,duration:.45,ease:'elastic.out(1,.5)'},c.tin+.12);
      tl.to(k+' .basket',{y:-10,duration:.28,yoyo:true,repeat:3,ease:'sine.inOut'},c.tin+.7);
    }
    if(c.tout < DURATION) tl.to(k,{opacity:0,y:-14,duration:.2,ease:'power2.in'},c.tout);
  }
  if(i>0) tl.fromTo('#flash',{opacity:0},{opacity:1,duration:.08,yoyo:true,repeat:1,ease:'sine.inOut',immediateRender:false},c.tin);
});
gsap.set('#flash',{opacity:0});
tl.set({}, {}, DURATION);
window.__hf = { duration: DURATION, seek: t => { tl.seek(t, false); } };
document.fonts.ready.then(()=>{ window.__ready = true; });
</script>
</body>
</html>
