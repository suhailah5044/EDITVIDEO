<!doctype html>
<html lang="ms" data-resolution="portrait">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#15171b}
#scene{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 45%,#2b2e34 0%,#1a1c20 60%,#101114 100%)}
#streak{position:absolute;left:520px;top:-200px;width:260px;height:1500px;transform:rotate(-38deg);
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(230,235,240,.16) 45%,rgba(255,255,255,.28) 50%,rgba(230,235,240,.12) 56%,rgba(255,255,255,0) 100%);filter:blur(18px)}
.g{position:absolute;font-family:"Inter","DejaVu Sans",sans-serif;font-weight:900;line-height:1;filter:blur(3px)}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="29.1" data-width="1080" data-height="1920">
  <div id="scene" class="clip" data-start="0" data-duration="29.1" data-track-index="0"><div id="streak"></div></div>
</div>
<script>
// glyph, x, y, size, rotation, yellow?
const G=[["A",70,120,230,-8,0],["ب",400,150,210,0,1],["1",760,110,220,6,0],["+",960,330,170,0,1],
["C",130,470,240,8,0],["2",560,420,200,-6,0],["ت",860,620,220,0,0],["3",60,800,220,-10,1],
["×",420,760,170,0,0],["B",700,920,240,10,0],["ا",250,1080,230,0,0],["−",900,1110,170,0,1],
["4",60,1340,220,6,0],["A",480,1300,220,-6,1],["ب",820,1420,210,0,0],["+",240,1610,170,0,0],
["C",620,1640,230,-8,0],["2",940,1760,200,8,1]];
const sc=document.getElementById("scene"), els=[];
G.forEach(([c,x,y,s,r,yl],i)=>{const d=document.createElement("div");d.className="g";d.textContent=c;
 d.style.left=x+"px";d.style.top=y+"px";d.style.fontSize=s+"px";
 d.style.color=yl?"rgba(255,214,10,.16)":"rgba(255,255,255,.13)";
 d.style.transform=`rotate(${r}deg)`;sc.appendChild(d);els.push([d,r,i]);});
const tl=gsap.timeline({paused:true});
els.forEach(([d,r,i])=>{ // very gentle slow float
  const dx=((i*29)%21-10)*1.6, dy=((i*17)%21-10)*2.2;
  tl.fromTo(d,{x:0,y:0,rotation:r},{x:dx,y:dy,rotation:r+((i%2)?3:-3),duration:29.1,ease:"sine.inOut"},0);
});
window.__timelines=window.__timelines||{}; window.__timelines["main"]=tl;
</script>
</body></html>
